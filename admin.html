<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoga Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f2f7;
    }

    .header {
      background: #9a4b7b;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      flex: 1;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #9a4b7b;
      font-size: 30px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .table-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 13px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    th {
      background: #9a4b7b;
      color: white;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-btn:hover {
      opacity: 0.8;
    }

    @media (max-width: 700px) {
      .stats {
        flex-direction: column;
      }

      th, td {
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🧘 Yoga Admin Dashboard</h1>
    <p>Manage your yoga class bookings</p>
  </div>

  <div class="container">

    <div class="stats">

      <div class="card">
        <p>Total Bookings</p>
        <h2 id="totalBookings">0</h2>
      </div>

      <div class="card">
        <p>Yoga Classes</p>
        <h2 id="yogaCount">0</h2>
      </div>

      <div class="card">
        <p>Meditation</p>
        <h2 id="meditationCount">0</h2>
      </div>

    </div>

    <input
      type="text"
      id="searchInput"
      class="search"
      placeholder="🔍 Search by name or phone..."
    >

    <div class="table-box">

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Program</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>

  </div>

  <script>

    let bookings = [];

    // ===============================
    // LOAD BOOKINGS
    // ===============================

    function loadBookings() {

      fetch("/bookings")
        .then(response => {

          if (!response.ok) {
            throw new Error("Bookings load failed");
          }

          return response.json();

        })
        .then(data => {

          bookings = data;

          updateStats(bookings);
          displayBookings(bookings);

        })
        .catch(error => {

          console.error("Load Error:", error);

          document.getElementById("tableBody").innerHTML = `
            <tr>
              <td colspan="6">
                Bookings load nahi ho rahi hain.
              </td>
            </tr>
          `;

        });

    }


    // ===============================
    // UPDATE STATS
    // ===============================

    function updateStats(data) {

      document.getElementById("totalBookings").textContent =
        data.length;

      document.getElementById("yogaCount").textContent =
        data.filter(item =>
          item.program === "Yoga Classes"
        ).length;

      document.getElementById("meditationCount").textContent =
        data.filter(item =>
          item.program === "Meditation"
        ).length;

    }


    // ===============================
    // DISPLAY BOOKINGS
    // ===============================

    function displayBookings(data) {

      const body = document.getElementById("tableBody");

      body.innerHTML = "";

      if (data.length === 0) {

        body.innerHTML = `
          <tr>
            <td colspan="6">
              No bookings found
            </td>
          </tr>
        `;

        return;
      }

      data.forEach(item => {

        body.innerHTML += `
          <tr>

            <td>${item.name || ""}</td>

            <td>${item.email || ""}</td>

            <td>${item.phone || ""}</td>

            <td>${item.program || ""}</td>

            <td>${item.date || ""}</td>

            <td>
              <button
                class="delete-btn"
                onclick="deleteBooking(${Number(item.id)})">
                🗑️ Delete
              </button>
            </td>

          </tr>
        `;

      });

    }


    // ===============================
    // SEARCH
    // ===============================

    document
      .getElementById("searchInput")
      .addEventListener("keyup", function () {

        const value = this.value.toLowerCase();

        const filtered = bookings.filter(item =>

          String(item.name || "")
            .toLowerCase()
            .includes(value)

          ||

          String(item.phone || "")
            .includes(value)

        );

        displayBookings(filtered);

      });


    // ===============================
    // DELETE BOOKING
    // ===============================

    function deleteBooking(id) {

      if (!id) {
        alert("Booking ID nahi mila.");
        return;
      }

      const confirmDelete = confirm(
        "Are you sure you want to delete this booking?"
      );

      if (!confirmDelete) {
        return;
      }

      fetch("/bookings/" + id, {
        method: "DELETE"
      })

      .then(async response => {

        const text = await response.text();

        console.log(
          "Delete response:",
          response.status,
          text
        );

        if (!response.ok) {
          throw new Error(
            "Server returned " + response.status
          );
        }

        return JSON.parse(text);

      })

      .then(result => {

        if (result.success) {

          alert("Booking deleted successfully! ✅");

          loadBookings();

        } else {

          alert(
            result.message ||
            "Booking delete nahi ho paayi."
          );

        }

      })

      .catch(error => {

        console.error("DELETE ERROR:", error);

        alert(
          "Delete nahi ho paayi. Server check karo."
        );

      });

    }


    // ===============================
    // START
    // ===============================

    loadBookings();

  </script>

</body>
</html>
